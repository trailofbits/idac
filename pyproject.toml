[project]
name = "idac"
version = "0.19.1"
description = "Agent-friendly CLI for IDA powered by ida-nexus"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jay Little / Trail of Bits", email = "jay@trailofbits.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ida-domain==0.5.1",
    "ida-hcli==0.20.1",
    "ida-nexus==0.7.0",
]

[project.scripts]
idac = "idac.cli:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.15.22",
    "ty>=0.0.56",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The idac skill is distributed as a Claude Code plugin (see .claude-plugin/marketplace.json),
# not as package data, so keep it out of the installed package.
wheel-exclude = ["skills/**"]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "1 week"
exclude-newer-package = { ida-nexus = "2026-08-21", ida-hcli = "2026-08-27" }

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "nexus_gui_live: optional live IDA GUI integration tests through ida-nexus",
    "requires_ida: needs a local IDA installation usable by ida-nexus; auto-skipped when unavailable",
]

[tool.coverage.run]
branch = true
source = ["src/idac"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

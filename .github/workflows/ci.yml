name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Lint
        run: make lint

  unit:
    name: Unit tests (Python 3.11, no IDA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"

      - name: Test without IDA
        run: make test-unit

  test:
    name: Test (IDA ${{ matrix.ida-version }})
    # Steps run for manual dispatches and for non-docs merge-queue changes. The
    # skips remain per-step so this required check still reports for pull requests
    # and docs-only merges.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ida-version: "9.4"
            installer-id: release/9.4/ida-pro/ida-pro_94_x64linux.run
    permissions:
      contents: read
    steps:
      - name: Check out repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect code changes
        if: github.event_name != 'pull_request'
        id: changes
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
          # markdown under src/ and tests/ is test-covered, so it counts as code
          if git diff --name-only "$BASE_SHA" HEAD | grep -qvE '^([^/]+\.md|docs/.+|LICENSE|\.gitignore)$'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: github.event_name != 'pull_request' && steps.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install IDA Pro
        if: github.event_name != 'pull_request' && steps.changes.outputs.code == 'true'
        env:
          IDA_INSTALLER_ID: ${{ matrix.installer-id }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
        run: |
          export IDADIR="$RUNNER_TEMP/opt/ida"
          echo "IDADIR=$IDADIR" >>"$GITHUB_ENV"
          uv run --locked hcli ida install --yes --download-id "$IDA_INSTALLER_ID" \
            --license-id "$IDA_LICENSE_ID" --install-dir "$IDADIR"

      - name: Test through ida-nexus
        if: github.event_name != 'pull_request' && steps.changes.outputs.code == 'true'
        run: |
          uv run --locked ida-nexus worker --probe
          make test-integration
